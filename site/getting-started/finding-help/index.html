  <h1>Finding Help <span class="tag-en">EN: Finding Help</span></h1>

  <h2 id="on-line-manual">The On-Line Manual (O Manual On-Line)</h2>

  <p>Este manual, baseado em WordPress, é mantido em tempo real por autores voluntários, que fazem alterações no documento conforme o programa muda. Se você está lendo o N1MM Manual pela web, está lendo a versão mais recente absoluta do manual do N1MM Logger+. Ele pode ficar alguns dias atrasado em relação às mudanças anunciadas do programa, mas dificilmente mais do que isso.</p>

  <h2 id="off-line-pdf-files">Off-Line PDF Files (Arquivos PDF Off-Line)</h2>

  <p>No entanto, você pode precisar acessar o manual do N1MM Logger+ a partir de um local sem acesso à internet, ou pode preferir usar o Adobe Reader para visualizar e pesquisar nos manuais.</p>

  <p>Há dois métodos para armazenar a documentação localmente em formato PDF da Adobe.</p>

  <ul>
    <li>Baixar automaticamente o arquivo PDF mais recente <em>de dentro do programa</em>, selecionando <em>&gt;Tools &gt;Download Latest N1MM Logger pdf manual</em>. Esse método localiza automaticamente o arquivo no site e o salva na subpasta SupportFiles da sua pasta de arquivos de usuário do N1MM+.</li>
    <li>Baixar manualmente o arquivo PDF mais recente <em>a partir do site</em>, selecionando <em>&gt;Download &gt;Documentation Download (PDF)</em>. Com esse método, você pode salvar o arquivo em qualquer local, mas o diretório recomendado é a subpasta SupportFiles da pasta de arquivos de usuário do N1MM+.</li>
  </ul>

  <div class="caixa-info">
    <strong>Abrindo o Manual em PDF de dentro do N1MM+</strong>
    <p>Quando você baixa o arquivo <em>n1mmplus.pdf</em> para a sua subpasta SupportFiles — usando qualquer um dos métodos descritos acima — esse arquivo pode ser aberto facilmente de dentro do programa, selecionando <em>&gt;Help &gt;N1MM Logger Manual</em>.</p>
  </div>

  <h2 id="discussion-forum">N1MM Logger Discussion Forum (Fórum de Discussão do N1MM Logger)</h2>

  <p>Você vai perceber que o N1MM Forum é o recurso mais ativo e útil para conseguir respostas para suas dúvidas sobre o N1MM+. Consulte a seção <a href="https://n1mmwp.hamdocs.com/support/" target="_blank" rel="noopener">&gt;Support &gt;N1MM Forum</a> para informações sobre cadastro e participação.</p>

  <h2 id="in-case-of-problems">In Case of Problems (Em Caso de Problemas)</h2>

  <p>Quando algo dá errado, parece que a primeira reação de muitos usuários é desinstalar e reinstalar o programa. Essa quase nunca é a resposta recomendada. A grande maioria dos problemas se deve a um arquivo de configurações corrompido (n1mm logger.ini) ou a um arquivo de banco de dados corrompido, e desinstalar e reinstalar não resolve nenhum dos dois casos, a menos que você também apague a sua área de arquivos de usuário — um passo bem mais drástico. Normalmente, você consegue o mesmo resultado apenas apagando um único arquivo (o arquivo n1mm logger.ini), sem passar pelo trabalho de desinstalar e reinstalar.</p>

  <p>O primeiro passo a tomar em caso de um problema que impeça o uso do programa é encerrar o programa, navegar até a pasta de arquivos de usuário do N1MM Logger+, e renomear o arquivo n1mm logger.ini — por exemplo, acrescentando .sav ao final do nome do arquivo. Reiniciar o programa fará com que ele comece do zero, como se fosse uma instalação nova, o que significa que quaisquer erros que tenham se infiltrado no arquivo de configuração serão eliminados. Se você investiu bastante esforço configurando o programa, pode preferir reiniciar a partir de um arquivo ini de backup que você sabe que estava bom. Você pode criar esse backup você mesmo, mas o programa também cria seus próprios backups automaticamente. Veja a seção Technical Information, nos Appendices do manual (ainda não traduzida), para saber como usar um desses arquivos de backup automático.</p>

  <p>Se você começar a partir de um arquivo ini novinho em folha, vai ver uma mensagem com três opções: Convert existing .mdb database (usada só para converter do N1MM Logger Classic para o N1MM Logger+ — é bem improvável que você precise escolher essa opção); Create new N1MM Logger+ database; e Open Existing N1MM Logger+ database. Se você tiver um arquivo de banco de dados que sabe que está bom, pode usar a terceira opção para abri-lo, mas a opção mais segura é a segunda (criar um novo arquivo de banco de dados). Se criar um novo banco de dados acabar sendo um passo desnecessário, você sempre pode usar o item de menu File &gt; Open Database... para voltar ao seu banco de dados original.</p>

  <p>Às vezes o problema é causado por um arquivo de banco de dados corrompido. Pode aparecer uma mensagem de erro citando o nome do arquivo problemático com alguma informação adicional críptica, como "database disk image is malformed". Se isso acontecer, feche o programa, navegue até a subpasta Databases na pasta de arquivos de usuário do N1MM+, encontre o arquivo problemático e renomeie-o (acrescentando algo ao nome do arquivo). Depois reinicie o programa. Se o arquivo corrompido era o seu banco de dados de log, você vai ver uma mensagem com três opções: Convert existing .mdb database (usada só para converter do N1MM Logger Classic para o N1MM Logger+ — é bem improvável que você precise escolher essa opção); Create new N1MM Logger+ database; e Open Existing N1MM Logger+ database. Se você tiver vários bancos de dados de log e souber que algum deles, diferente do que causou o erro, está bom, pode usar a terceira opção e escolher o arquivo de banco de dados bom, mas na maioria dos casos, a segunda opção é a que você vai querer. Você vai precisar dar ao novo banco de dados um nome de arquivo diferente do que teve o problema.</p>

  <p>Muitas vezes, renomear o arquivo ini/restaurar um backup e/ou criar um novo banco de dados/abrir um banco de dados que se sabe que está bom resolve o problema. Se isso não resolver (por exemplo, se você encontrou um bug no programa — sim, eles existem — ou se você precisa de ajuda para usar algum recurso do programa), então o <a href="https://n1mmwp.hamdocs.com/support/" target="_blank" rel="noopener"><strong>N1MM+ Discussion Forum</strong></a> no groups.io é o lugar para buscar ajuda.</p>

  <p>Às vezes o programa emite uma "Run-Time Error Message" com um longo rastro de depuração. Se você ver uma dessas, ou se encontrar um erro sério que não possa ser resolvido por nenhuma das técnicas descritas acima, a equipe de desenvolvimento pede que você registre um relatório de bug no <a href="https://n1mmwp.hamdocs.com/support/trouble-ticket/" target="_blank" rel="noopener"><strong>site</strong></a>. Para isso, você vai precisar cadastrar um nome de usuário e senha e fazer login no site.</p>
